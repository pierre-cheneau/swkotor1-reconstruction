[project]
name = "swkotor1-reconstruction-tools"
version = "0.1.0"
description = "Build, generation and matching tools for the swkotor.exe reconstruction"
requires-python = ">=3.13"
dependencies = [
    "pefile==2024.8.26",
    "capstone==5.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "matching/tools"]
pythonpath = [".", "tests", "matching/tools"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["src", "matching/src", "matching/include"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic values: addresses, sizes and opcodes are the domain
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PLC0415",  # optional dependencies are imported where used
    "RUF001", "RUF002", "RUF003",  # typographic characters in user-facing text
    "B905",     # zip() pairs sequences of deliberately different lengths
]

[tool.ruff.lint.per-file-ignores]
# The transcription's address tables and emitted comment text stay one item per line.
"local_math/gen_l1_asm.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["local_generators", "local_math", "build", "pin_sources", "coff", "playable", "matchcmp",
                     "symbolmap", "libmatch", "ppcnames", "render_banner", "todo", "bridge_sources", "synthetic_pe",
                     "synthetic_coff",
                     "generator_harness", "build_harness", "math_harness", "l1_fixture", "l1_object"]
